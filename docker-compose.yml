services:
  db:
    # No custom build/schema mount here anymore — schema setup is owned entirely by
    # `backend`'s migration runner (backend/src/db/migrate.js), which runs on every
    # startup against whatever's actually in the database, not just once on an empty
    # volume. Postgres itself just needs to be up; the postgis/postgis image already
    # enables the extension on first boot via its own bundled init scripts.
    image: postgis/postgis:16-3.4
    container_name: montana-ret-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-montana_real_estate}
      POSTGRES_USER: ${POSTGRES_USER:-mret}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the stack environment}
    # Not published to the host — only `backend` needs to reach this, over the compose
    # network by service name (`db:5432`). Publishing 5432 to the host would put Postgres
    # directly on the internet on any public Portainer host for no operational benefit.
    # Temporarily uncomment `ports: ["5432:5432"]` here if you need local `psql` access.
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      # First-ever start runs CREATE EXTENSION postgis + populates spatial_ref_sys
      # (~8,500 rows) before Postgres is actually up — commonly 60-90s+ on modest
      # hardware. Failures during start_period don't count toward `retries`, so this
      # gives that first-time init room without needing to hand-tune retries/interval
      # for what's a one-time cost (subsequent restarts with the volume already
      # initialized come up in a few seconds).
      start_period: 120s

  backend:
    build: ./backend
    container_name: montana-ret-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-montana_real_estate}
      PGUSER: ${POSTGRES_USER:-mret}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the stack environment}
      # Optional: set to enable POST /api/ingest (manual re-ingestion trigger). Left unset,
      # that endpoint is disabled entirely rather than open with no auth.
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    # Not published to the host — `frontend`'s nginx already reverse-proxies /api/* to this
    # service over the compose network (`backend:3000`), so a separate host port is
    # redundant exposure. Temporarily uncomment `ports: ["3000:3000"]` for direct debugging.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: montana-ret-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  mcp-server:
    build: ./mcp-server
    container_name: montana-ret-mcp
    restart: unless-stopped
    # Not started by default — a plain `docker compose up` (or a Portainer deploy with no
    # profile set) skips this entirely. Opt in with `docker compose --profile mcp up` (or
    # Portainer's equivalent) once MCP_TOKEN is set below.
    profiles: ["mcp"]
    depends_on:
      db:
        condition: service_healthy
      # Schema setup lives entirely in backend's migration runner now (see db's comment
      # above) — waiting on backend being healthy is the honest proxy for "schema is
      # ready" here, since backend now exits (and so never becomes healthy) if migrations
      # fail, rather than starting mcp-server against a database that might not have the
      # tables it queries yet.
      backend:
        condition: service_healthy
    environment:
      PORT: 3100
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-montana_real_estate}
      PGUSER: ${POSTGRES_USER:-mret}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the stack environment}
      # Required — the server refuses to start without it (fails closed rather than
      # running with no auth at all). Deliberately not using compose's ${VAR:?...}
      # hard-require here since this service is profile-gated and shouldn't block
      # deploying the rest of the stack for anyone not using it; the app itself enforces
      # this instead (see mcp-server/src/server.js).
      MCP_TOKEN: ${MCP_TOKEN:-}
    # Published directly to the host — unlike backend/db, there's no nginx in front of
    # this, and the whole point of choosing remote HTTP transport (see Phase 8 in the
    # plan doc) is being reachable from wherever you run Claude, not just the compose
    # network. MCP_TOKEN is the access control for this exposure.
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db_data:
