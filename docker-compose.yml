services:
  db:
    image: postgis/postgis:16-3.4
    container_name: montana-ret-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-montana_real_estate}
      POSTGRES_USER: ${POSTGRES_USER:-mret}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the stack environment}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
